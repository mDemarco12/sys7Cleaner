<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Macintosh Cleaning Assistant</title>
<link rel="stylesheet" href="css/system7.css">
</head>
<body>

<div id="splash" class="splash-overlay">
  <div class="splash-box">
    <img src="img/welcome.png" alt="Welcome to Macintosh">
  </div>
</div>

<div class="mac-window">
  <div class="title-bar active boot-section" data-tauri-drag-region>
    <div class="win-box close"></div>
    <div class="title-stripes"></div>
    <div class="title-text">Macintosh HD Cleanup Utility</div>
    <div class="title-stripes"></div>
    <div class="win-box minimize"></div>
    <div class="win-box zoom"></div>
  </div>

  <div class="content">
    <div class="toolbar boot-section">
      <button id="scan-btn" class="sys7-btn">Scan Mac</button>
      <button id="cancel-btn" class="sys7-btn" disabled>Cancel</button>
    </div>

    <div id="status-bar" class="status-bar boot-section">
      <span id="status-text"></span>
      <div id="progress-bar" class="progress-bar"><div class="sweep"></div></div>
    </div>

    <div class="content-body boot-section">
      <div id="icon-grid" class="icon-grid" style="display:none"></div>
      <pre id="log-pane" class="log-pane"></pre>
    </div>
  </div>
</div>

<script src="js/icons.js"></script>
<script src="js/splash.js"></script>
<script src="js/chrome.js"></script>
<script src="js/app.js"></script>
</body>
</html>
