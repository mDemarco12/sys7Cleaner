
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>System 7 Cleaner</title>
<style>
body{background:#d8d8d8;font-family:Geneva,sans-serif;margin:20px}
.window{border:2px solid #000;background:#fff;padding:12px}
button{padding:6px 12px}
#out{white-space:pre-wrap;font-family:monospace;font-size:12px}
</style>
</head>
<body>
<div class="window">
<h2>Macintosh HD Cleanup Utility</h2>
<button id="scan-btn">Scan Mac</button>
<button id="cancel-btn" disabled>Cancel</button>
<pre id="out">M2 IPC smoke test. Click "Scan Mac".</pre>
</div>
<script>
const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;

const out = document.getElementById("out");
const scanBtn = document.getElementById("scan-btn");
const cancelBtn = document.getElementById("cancel-btn");
let currentScanId = null;

async function loadTargets() {
  const targets = await invoke("list_targets");
  out.textContent = "Catalog (" + targets.length + " targets):\n" +
    targets.map(t => `  [${t.safety}] ${t.id} — ${t.label}`).join("\n");
}

async function startScan() {
  scanBtn.disabled = true;
  cancelBtn.disabled = false;
  out.textContent = "Starting scan...\n";
  const targetIds = ["xcode-derived-data", "homebrew-cache", "npm-cache", "library-logs"];
  currentScanId = await invoke("start_scan", { targetIds });
  out.textContent += `scan_id = ${currentScanId}\n`;
}

async function cancelScan() {
  if (currentScanId) {
    await invoke("cancel_scan", { scanId: currentScanId });
    out.textContent += "Cancel requested.\n";
  }
}

listen("scan://progress", (event) => {
  const { files_seen, bytes_seen } = event.payload;
  out.textContent = out.textContent.replace(/^progress:.*$/m, "").trimEnd() +
    `\nprogress: ${files_seen} files, ${bytes_seen} bytes (synthetic tick)`;
});

listen("scan://done", (event) => {
  scanBtn.disabled = false;
  cancelBtn.disabled = true;
  out.textContent += "\n\nDONE:\n" + JSON.stringify(event.payload.summary, null, 2);
});

scanBtn.addEventListener("click", startScan);
cancelBtn.addEventListener("click", cancelScan);
loadTargets();
</script>
</body>
</html>
